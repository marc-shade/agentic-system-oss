[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-cognitive-daemon"
version = "0.1.0"
description = "Pixel's Always-On Brain - Continuous cognitive processes for AGI development"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Pixel", email = "pixel@agentic.local"}
]

dependencies = [
    "aiosqlite>=0.19.0",
    "qdrant-client>=1.7.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "schedule>=1.2.0",
    "watchdog>=3.0.0",
    "structlog>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
acd = "acd.daemon:main"
acd-status = "acd.daemon:status"

[tool.setuptools.packages.find]
where = ["src"]
