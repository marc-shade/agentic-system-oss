[project]
name = "agent-eval-mcp"
version = "0.1.0"
description = "MCP server for Agent Eval Framework - Eugene Yan's 3-step methodology"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
