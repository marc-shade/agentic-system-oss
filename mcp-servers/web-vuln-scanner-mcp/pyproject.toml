[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-vuln-scanner-mcp"
version = "0.1.0"
description = "Web Application Vulnerability Scanner - OWASP Top 10 detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
web-vuln-scanner-mcp = "web_vuln_scanner_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_vuln_scanner_mcp"]
