service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334

storage:
  # Storage path - absolute path required for launchd startup
  # Platform paths: macOS=/Volumes/SSDRAID0, Linux=/home/marc/agentic-system
  storage_path: /Volumes/SSDRAID0/agentic-system/databases/qdrant

  # Performance optimizations for SSD
  performance:
    max_search_threads: 4

  # Enable on-disk payload storage for large datasets
  on_disk_payload: true

# Logging configuration
log_level: INFO

# Disable telemetry to prevent crashes at boot (network not ready)
telemetry_disabled: true

# Enable service API for health checks
service_api:
  enabled: true
