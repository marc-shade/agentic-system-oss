# Memory Consolidation Configuration
# Based on: "Sleep-Inspired Memory Consolidation for Persistent AI Agents" (Shade, 2025)
# Research findings: Cohen's d = 2.31, p = 0.007
#
# Key insight: Architecture > Features
# The multi-tier structure with temporal organization provides the primary benefit,
# not individual consolidation features like memory replay.

version: "1.0"
research_paper: "https://github.com/marc-shade/memory-consolidation"

# =============================================================================
# CONSOLIDATION TIMING (from paper: every ~10 sessions optimal)
# =============================================================================
consolidation:
  # Time-based trigger (hours between consolidation runs)
  interval_hours: 6

  # Session-based trigger (number of sessions before consolidation)
  # Research shows every ~10 sessions is optimal
  session_threshold: 10

  # Time window for pattern extraction (hours)
  pattern_extraction_window: 24

  # Minimum pattern frequency to promote to semantic memory
  min_pattern_frequency: 3

  # Minimum confidence for causal link creation
  min_causal_confidence: 0.6

  # Age threshold for memory compression (hours)
  compression_age_hours: 168  # 1 week

  # Compute overhead budget (research: ~15% acceptable)
  max_overhead_percent: 15

# =============================================================================
# 75/15/10 RULE - Content Prioritization
# =============================================================================
content_priorities:
  # Target distribution for optimal AGI performance
  reasoning_centric:
    target_percent: 75
    content_types:
      - code
      - algorithms
      - mathematics
      - logic
      - scientific_methods
      - formal_reasoning
      - causal_analysis
    tier_boost: 1.3  # Boost retrieval weight by 30%

  visual_centric:
    target_percent: 15
    content_types:
      - images
      - diagrams
      - spatial_reasoning
      - visual_patterns
    tier_boost: 1.0

  general:
    target_percent: 10
    content_types:
      - general_knowledge
      - conversational
      - metadata
    tier_boost: 0.8  # Demote in retrieval

# =============================================================================
# MEMORY TIERS (from biological memory architecture)
# =============================================================================
tiers:
  working:
    description: "Active context with TTL-based expiration"
    default_ttl_minutes: 60
    max_items: 50
    promotion_threshold: 3  # Access count to promote to episodic

  episodic:
    description: "Time-bound experiences with significance scores"
    min_significance: 0.3
    consolidation_threshold: 0.7  # Significance to promote to semantic
    decay_rate: 0.1  # Ebbinghaus forgetting curve coefficient

  semantic:
    description: "Distilled concepts and principles (timeless)"
    min_confidence: 0.5
    abstraction_levels: 3
    max_related_concepts: 10

  procedural:
    description: "Learned skills with execution tracking"
    min_success_rate: 0.5
    execution_history_size: 100
    skill_decay_rate: 0.05

# =============================================================================
# EBBINGHAUS FORGETTING CURVES
# =============================================================================
forgetting:
  # Memory strength decay formula: strength = e^(-k*t)
  # where k = decay_coefficient, t = time since last access

  # Base decay coefficient (lower = slower forgetting)
  base_decay_coefficient: 0.1

  # Spacing effect: accessing memory boosts strength
  retrieval_boost: 0.2

  # Minimum strength before memory is eligible for compression
  compression_threshold: 0.2

  # High-salience memories decay slower
  salience_decay_modifier: 0.5  # High salience = 50% slower decay

# =============================================================================
# ASSOCIATIVE MEMORY NETWORK
# =============================================================================
associations:
  # Spreading activation parameters
  activation_threshold: 0.3
  max_hops: 3
  decay_per_hop: 0.5

  # Association types
  types:
    - semantic
    - temporal
    - causal
    - emotional
    - spatial

  # Reinforcement on co-activation
  co_activation_boost: 0.1

  # Strong association threshold
  strong_threshold: 0.7

# =============================================================================
# EMOTIONAL TAGGING (salience scoring)
# =============================================================================
emotional_memory:
  enabled: true

  # Valence-arousal-dominance model
  dimensions:
    valence: [-1.0, 1.0]      # negative to positive
    arousal: [0.0, 1.0]       # calm to excited
    dominance: [0.0, 1.0]     # controlled to in-control

  # Primary emotions for categorization
  primary_emotions:
    - joy
    - sadness
    - anger
    - fear
    - surprise
    - disgust

  # High emotional salience memories are prioritized
  salience_weight_in_retrieval: 0.4

# =============================================================================
# CLUSTER INTEGRATION
# =============================================================================
cluster:
  enabled: true

  # Share consolidation across cluster nodes
  shared_semantic_memory: true

  # Sync learnings to cluster brain
  sync_learnings: true

  # Node-specific episodic memory (not shared)
  local_episodic: true

# =============================================================================
# LOGGING AND MONITORING
# =============================================================================
monitoring:
  log_level: INFO
  log_file: /var/log/memory-consolidation.log

  # Metrics to track
  metrics:
    - consolidation_duration_ms
    - patterns_extracted
    - memories_promoted
    - memories_compressed
    - tier_distribution
    - content_type_distribution

  # Alert thresholds
  alerts:
    consolidation_failure_count: 3
    memory_growth_rate_percent: 50
    reasoning_content_below_percent: 50
