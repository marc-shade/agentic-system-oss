name: Arduino Status Rotation CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run unit tests
      run: |
        cd tests
        pytest test_status_rotation.py -v --cov=../status_rotation --cov-report=xml

    - name: Run integration tests
      run: |
        cd tests
        pytest test_integration_status_rotation.py -v --cov=../status_rotation --cov-report=xml --cov-append

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./tests/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install pylint black flake8

    - name: Run black formatter check
      run: black --check status_rotation.py

    - name: Run flake8
      run: flake8 status_rotation.py --max-line-length=100 --extend-ignore=E203

    - name: Run pylint
      run: pylint status_rotation.py --disable=C0114,C0115,C0116

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit security scan
      run: bandit -r . -f json -o bandit-report.json || true

    - name: Check dependencies for vulnerabilities
      run: |
        pip freeze > requirements-frozen.txt
        safety check --file requirements-frozen.txt || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          requirements-frozen.txt

  build:
    name: Build Package
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Create distribution
      run: |
        python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist-package
        path: dist/

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: dist-package
        path: dist/

    - name: Create deployment manifest
      run: |
        echo "Deployment: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > deployment-manifest.txt
        echo "Commit: ${{ github.sha }}" >> deployment-manifest.txt
        echo "Branch: ${{ github.ref_name }}" >> deployment-manifest.txt
        echo "Actor: ${{ github.actor }}" >> deployment-manifest.txt

    - name: Upload deployment manifest
      uses: actions/upload-artifact@v3
      with:
        name: deployment-manifest
        path: deployment-manifest.txt
