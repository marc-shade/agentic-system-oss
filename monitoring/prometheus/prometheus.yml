global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'claude-code'
    static_configs:
      - targets: ['host.containers.internal:9464']
        labels:
          instance: 'macpro51'
          service: 'claude-code'

    # Scrape more frequently for real-time statusline updates
    scrape_interval: 3s
    scrape_timeout: 2s
