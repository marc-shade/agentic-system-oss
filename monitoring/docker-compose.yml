version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9700:9090"
    volumes:
      - ./prometheus/config:/etc/prometheus:Z
      - ./prometheus/data:/prometheus:Z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9900:3100"
    volumes:
      - ./loki/config:/etc/loki:Z
      - ./loki/data:/loki:Z
    command: -config.file=/etc/loki/loki.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "9500:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana:Z
      - ./grafana/provisioning:/etc/grafana/provisioning:Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:Z
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://macpro51.local:9500
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    user: "0:968"  # root:docker - required for Docker socket access
    ports:
      - "9080:9080"
    volumes:
      - ./promtail/config:/etc/promtail:Z
      - /var/log/journal:/var/log/journal:ro,z
      - /run/log/journal:/run/log/journal:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:z
      - /home/marc/agentic-system/builder-node/artifacts:/home/marc/agentic-system/builder-node/artifacts:ro,z
      - /home/marc/agentic-system/monitoring:/home/marc/agentic-system/monitoring:ro,z
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - monitoring
    depends_on:
      - loki
    security_opt:
      - label=type:container_runtime_t

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/config:/etc/alertmanager:Z
      - ./alertmanager/data:/alertmanager:Z
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://macpro51.local:9093'
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
