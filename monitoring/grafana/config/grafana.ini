# Grafana Configuration for Agentic System
# Main visualization dashboard for all monitoring data

[paths]
data = /Volumes/SSDRAID0/agentic-system/monitoring/grafana/data
logs = /Volumes/SSDRAID0/agentic-system/monitoring/grafana/logs
plugins = /Volumes/SSDRAID0/agentic-system/monitoring/grafana/plugins
provisioning = /Volumes/SSDRAID0/agentic-system/monitoring/grafana/provisioning

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 9500
domain = localhost
root_url = http://localhost:3101/grafana
serve_from_sub_path = true

[database]
type = sqlite3
path = /Volumes/SSDRAID0/agentic-system/monitoring/grafana/data/grafana.db

[security]
admin_user = admin
admin_password = admin
secret_key = ***REMOVED***

[plugins]
enable_alpha = false
app_tls_skip_verify_insecure = false
allow_loading_unsigned_plugins = grafana-lokiexplore-app,grafana-pyroscope-app,grafana-metricsdrilldown-app

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = true
org_name = 2 Acre Studios
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console file
level = info

[log.console]
level = info
format = text

[log.file]
level = info
format = text
log_rotate = true
max_lines = 1000000
max_size_shift = 28
daily_rotate = true
max_days = 7

[unified_alerting]
enabled = true
execute_alerts = true
