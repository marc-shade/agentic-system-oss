# Loki Configuration for Agentic System
# Aggregates logs from all autonomous system components

auth_enabled: false

server:
  http_listen_port: 9900
  grpc_listen_port: 9901

common:
  instance_addr: 127.0.0.1
  path_prefix: /mnt/agentic-system/monitoring/loki/data
  storage:
    filesystem:
      chunks_directory: /mnt/agentic-system/monitoring/loki/data/chunks
      rules_directory: /mnt/agentic-system/monitoring/loki/data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Storage configuration
storage_config:
  tsdb_shipper:
    active_index_directory: /mnt/agentic-system/monitoring/loki/data/tsdb-shipper-active
    cache_location: /mnt/agentic-system/monitoring/loki/data/tsdb-shipper-cache
    cache_ttl: 24h
  filesystem:
    directory: /mnt/agentic-system/monitoring/loki/data/chunks

compactor:
  working_directory: /mnt/agentic-system/monitoring/loki/data/tsdb-shipper-compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# Limits configuration
limits_config:
  retention_period: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_entries_limit_per_query: 5000
  max_cache_freshness_per_query: 10m
  reject_old_samples: true
  reject_old_samples_max_age: 168h

# Table manager for retention
table_manager:
  retention_deletes_enabled: true
  retention_period: 168h
