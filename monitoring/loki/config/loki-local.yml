auth_enabled: false

server:
  http_listen_port: 9900
  grpc_listen_port: 9901

common:
  path_prefix: /Volumes/SSDRAID0/agentic-system/monitoring/loki/data
  storage:
    filesystem:
      chunks_directory: /Volumes/SSDRAID0/agentic-system/monitoring/loki/data/chunks
      rules_directory: /Volumes/SSDRAID0/agentic-system/monitoring/loki/data/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /Volumes/SSDRAID0/agentic-system/monitoring/loki/data/tsdb-index
    cache_location: /Volumes/SSDRAID0/agentic-system/monitoring/loki/data/tsdb-cache

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  retention_period: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  allow_structured_metadata: true

compactor:
  working_directory: /Volumes/SSDRAID0/agentic-system/monitoring/loki/data/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem
